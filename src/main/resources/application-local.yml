management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s,5s,10s,20s
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,threaddump
  endpoint:
    prometheus:
      access: read_only
